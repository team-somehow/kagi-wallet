; Kagi wrist shard for the M5StickS3.
; Board settings follow M5Stack's StickS3 docs. Development firmware: no secure boot,
; no flash encryption, reflashable any time.
[env:sticks3]
; Arduino core 3.x (ESP-IDF 5): M5Stack requires it for StickS3 IR.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.7.3
    h2zero/NimBLE-Arduino@^2.5.1

; Test build for the hardware self-test only. Presses A by itself. Never leave this on the wrist.
[env:sticks3-autotest]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DKAGI_AUTO_APPROVE

; Bench build with the radio off, to separate WiFi effects from IR.
[env:sticks3-nowifi]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DKAGI_NO_WIFI

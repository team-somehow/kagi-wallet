; Ground-truth IR test for the ESP32 S3 board with the board support library example code (needs Arduino core 3.x).
; Flash role=tx on one stick and role=rx on the other.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps = M5Unified=https://github.com/m5stack/M5Unified

[env:tx]
build_flags = ${env.build_flags} -DROLE_TX

[env:rx]
build_flags = ${env.build_flags} -DROLE_RX
